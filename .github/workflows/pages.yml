name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # One-time copy of images, video and CV from Wix. Files already in the
      # repo are skipped, so once everything is saved this step does nothing.
      - name: Save media from Wix into the repo
        run: |
          set -u
          failed=0
          while read -r name url; do
            [ -z "$name" ] && continue
            if [ ! -s "images/$name" ]; then
              echo "Downloading $name"
              curl -fsSL --retry 3 -o "images/$name" "$url" || { echo "::warning::Could not download $url"; rm -f "images/$name"; failed=1; }
            fi
          done < images/downloads.txt
          if [ -n "$(git status --porcelain images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images
            git commit -m "Save media copied from the Wix site"
            git push
          fi

      # Give the stylesheet a new address on every publish so browsers
      # never mix a cached old stylesheet with new pages.
      - name: Version the stylesheet link
        run: |
          v="${GITHUB_SHA::8}"
          find . -name '*.html' -not -path './.git/*' -print0 | xargs -0 sed -i -E "s#/assets/style\.css(\?v=[A-Za-z0-9]+)?\"#/assets/style.css?v=$v\"#g"
          grep -c "style.css?v=$v" index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
